<!DOCTYPE html>
<html>
<head>
<title>BAYTK Real Estate</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    height: 100vh;
    color: white;
  }

  /* شريط التنقل العلوي */
  .navbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 20px 40px;
    gap: 25px;
    background: rgba(0, 0, 0, 0.2);
  }

  .navbar a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
  }

  .navbar a:hover {
    text-decoration: underline;
  }

  /* محتوى المنتصف (العنوان وخانة البحث) */
  .hero-content {
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
  }

  .hero-content h1 {
    font-size: 50px;
    margin-bottom: 10px;
    font-weight: bold;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    letter-spacing: 1px;
  }

  .hero-content p {
    font-size: 16px;
    margin-bottom: 30px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    color: #e2e8f0;
  }

  /* تنسيق خانة البحث */
  .search-box {
    display: inline-flex;
    background: white;
    padding: 4px;
    border-radius: 4px;
    overflow: hidden;
    width: 65%;
    max-width: 550px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .search-box input {
    border: none;
    padding: 14px 16px;
    font-size: 15px;
    outline: none;
    flex-grow: 1;
    color: #333;
  }

  .search-box input::placeholder {
    color: #888;
  }

  .search-box button {
    background-color: #111b2b;
    color: white;
    border: none;
    padding: 0 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
  }

  .search-box button:hover {
    background-color: #1e293b;
  }
</style>
</head>
<body>

<!-- شريط التنقل العلوي -->
<div class="navbar">
  <a href="#">Home</a>
  <a href="#">Buy</a>
  <a href="#">Sell</a>
  <a href="#">Rent</a>
  <a href="#">Marketing</a>
  <a href="#">About Us</a>
  <a href="#">Log In</a>
</div>

<!-- المحتوى في المنتصف -->
<div class="hero-content">
  <h1>Find Your Dream House</h1>
  <p>Buy, Sell & Rent Properties Across Saudi Arabia</p>
  
  <div class="search-box">
    <input type="text" placeholder="Search by city, district or property">
    <button>Search</button>
  </div>
</div>

</body>
</html>
